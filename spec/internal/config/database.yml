# Defaults to SQLite. Set DB=postgres to run against PostgreSQL, which
# picks up the standard PGHOST/PGUSER/PGPASSWORD environment variables.
<% if ENV["DB"] == "postgres" %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  database: dynamic_image_development

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "dynamic_image_test") %>

production:
  <<: *default
  database: dynamic_image_production
<% else %>
default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3

production:
  <<: *default
  database: db/production.sqlite3
<% end %>
